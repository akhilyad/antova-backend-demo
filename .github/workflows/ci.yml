name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same as the Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: antova_backend/backend/antova_requirements.txt
      - run: pip install -r antova_requirements.txt
      # conftest.py blanks every model API key and uses a temp database, so this never calls a paid API.
      - run: python -m pytest -q
      # The browser's sensitivity preview is pinned to the engine; an engine change must regenerate it.
      - name: Sensitivity parity fixture is current
        run: |
          python ../frontend/scripts/gen_sensitivity_parity.py
          git diff --exit-code -- ../frontend/scripts/fixtures/sensitivity-parity.json
      # The built-in TS engine is checked against these seeded Python results (scripts/test-properties.mjs).
      - name: Financials parity fixture is current
        run: |
          python ../frontend/scripts/gen_financials_parity.py
          git diff --exit-code -- ../frontend/scripts/fixtures/financials-parity.json

  web:
    name: Brief site (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend/backend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: antova_backend/backend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the parity cases that pin the TypeScript leveling math to the Python engine.
      - run: npm test

  workbench:
    name: Workbench (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: antova_backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ strips TypeScript types natively, which the unit tests rely on.
          node-version: 22
          cache: npm
          cache-dependency-path: antova_backend/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:snapshot
      - run: npm run build
