<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="wb-title wb-desc">
  <title id="wb-title">Antova Workbench</title>
  <desc id="wb-desc">On the benchmark tender, the lowest headline bid of 418,000 euros becomes the most expensive at 479,650 euros once the gaps in the bid are priced.</desc>
  <defs>
    <clipPath id="wb-frame"><rect width="1280" height="420" rx="28"/></clipPath>
    <pattern id="wb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F6F2EA" stroke-opacity="0.05"/>
    </pattern>
    <pattern id="wb-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#15120F" stroke-opacity="0.35" stroke-width="3"/>
    </pattern>
    <linearGradient id="wb-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#FFE98A"/>
    </linearGradient>
    <linearGradient id="wb-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4400F" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#D4400F" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#FFE98A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE98A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#wb-frame)">
    <rect width="1280" height="420" fill="#15120F"/>
    <rect width="1280" height="420" fill="url(#wb-grid)"/>
    <rect width="1280" height="3" fill="url(#wb-top)"/>

    <!-- left: wordmark and copy -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
      <text x="72" y="96" font-size="15" letter-spacing="3" fill="#FFE98A" fill-opacity="0.85">ANTOVA · TENDER AUDIT</text>
      <text x="72" y="178" font-size="68" font-weight="700" fill="url(#wb-word)">Workbench</text>
      <text x="72" y="232" font-size="24" fill="#F6F2EA">The lowest bid is not the cheapest bid.</text>
      <text x="72" y="266" font-size="17" fill="#F6F2EA" fill-opacity="0.68">Every flag ties to the page and the exact words behind it.</text>
      <text x="72" y="292" font-size="17" fill="#F6F2EA" fill-opacity="0.68">A named reviewer signs off before an audit is final.</text>

      <g transform="translate(72 336)" font-size="13" letter-spacing="1">
        <rect width="118" height="30" rx="15" fill="none" stroke="#F6F2EA" stroke-opacity="0.35"/>
        <text x="59" y="20" text-anchor="middle" fill="#F6F2EA" fill-opacity="0.85">Next.js 15</text>
        <rect x="130" width="166" height="30" rx="15" fill="none" stroke="#F6F2EA" stroke-opacity="0.35"/>
        <text x="213" y="20" text-anchor="middle" fill="#F6F2EA" fill-opacity="0.85">Cloudflare Workers</text>
        <rect x="308" width="106" height="30" rx="15" fill="none" stroke="#F6F2EA" stroke-opacity="0.35"/>
        <text x="361" y="20" text-anchor="middle" fill="#F6F2EA" fill-opacity="0.85">FastAPI</text>
      </g>
    </g>

    <!-- right: the benchmark result, drawn from TENDER-2026-402 expected.json -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
      <rect x="700" y="52" width="520" height="316" rx="18" fill="#F6F2EA" fill-opacity="0.04" stroke="#F6F2EA" stroke-opacity="0.18"/>
      <text x="728" y="78" font-size="14" letter-spacing="2" fill="#F6F2EA" fill-opacity="0.7">EVALUATED COST, TENDER-2026-402</text>

      <line x1="728" y1="318" x2="1192" y2="318" stroke="#F6F2EA" stroke-opacity="0.35"/>

      <!-- Vendor A: 452,000 -> 135 px on a baseline of 400,000 -->
      <rect x="760" y="183" width="96" height="135" rx="4" fill="#F6F2EA" fill-opacity="0.82"/>
      <text x="808" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#F6F2EA">€452,000</text>
      <text x="808" y="342" text-anchor="middle" font-size="14" fill="#F6F2EA" fill-opacity="0.75">Vendor A</text>

      <!-- Vendor B: headline 418,000, evaluated 479,650 -->
      <rect x="912" y="111" width="96" height="207" rx="4" fill="#D4400F"/>
      <rect x="912" y="111" width="96" height="160" rx="4" fill="url(#wb-hatch)"/>
      <line x1="896" y1="271" x2="1024" y2="271" stroke="#FFE98A" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="1030" y="262" font-size="12" fill="#FFE98A">headline</text>
      <text x="1030" y="278" font-size="12" font-weight="600" fill="#FFE98A">€418,000</text>
      <text x="960" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#FFE98A">€479,650</text>
      <text x="960" y="342" text-anchor="middle" font-size="14" fill="#F6F2EA" fill-opacity="0.75">Vendor B</text>

      <!-- Vendor C: 454,000 -> 140 px -->
      <rect x="1088" y="178" width="96" height="140" rx="4" fill="#F6F2EA" fill-opacity="0.82"/>
      <text x="1136" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#F6F2EA">€454,000</text>
      <text x="1136" y="342" text-anchor="middle" font-size="14" fill="#F6F2EA" fill-opacity="0.75">Vendor C</text>

      <text x="728" y="358" font-size="11" fill="#F6F2EA" fill-opacity="0.5">Bar axis starts at €400,000. Vendor B total is a lower bound: one gap cannot be priced.</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#F6F2EA" stroke-opacity="0.16"/>
</svg>
